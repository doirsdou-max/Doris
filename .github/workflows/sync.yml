name: Sync Feishu Data
on:
  repository_dispatch:
    types: [feishu-sync]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sleep 15 && python sync.py  # 等飞书公式字段计算完再拉
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "sync: update data.json" && git push)
