<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查询 AI 能力测评报告</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A1628;
      color: #FFFFFF;
      font-family: 'PingFang SC', '苹方', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      background: #0F2040;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      text-align: center;
    }
    .logo {
      font-size: 11px;
      color: #4A6A8A;
      letter-spacing: 0.05em;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 13px;
      color: #8BA3C4;
      margin-bottom: 36px;
      line-height: 1.6;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    input[type="text"] {
      width: 100%;
      background: #162B4A;
      border: 1px solid #1E3A5F;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 15px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="text"]:focus { border-color: #4A9EFF; }
    input[type="text"]::placeholder { color: #4A6A8A; }
    button {
      width: 100%;
      background: #4A9EFF;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.7;
      min-height: 24px;
    }
    .msg.error { color: #FF6B6B; }
    .msg.info  { color: #8BA3C4; }
    .msg.success { color: #00D4AA; }
    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: #4A6A8A;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">网易有道领世中台</div>
  <h1 id="pageTitle">AI 能力测评报告</h1>
  <p class="sub" id="pageSub">输入填表时使用的姓名<br>查询您的专属测评报告</p>

  <div class="input-wrap">
    <input type="text" id="nameInput" placeholder="请输入您的姓名" maxlength="20" autocomplete="off">
  </div>
  <button id="queryBtn" onclick="query()">查询报告</button>
  <div class="msg info" id="msg"></div>

  <div class="footer">本测评由网易有道领世中台出品</div>
</div>

<script>
// ── 读取本地 data.json（由 GitHub Action 每5分钟同步）──
// 彻底绕过 CORS 问题

function setMsg(text, type = 'info') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function query() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { setMsg('请输入姓名', 'error'); return; }

  const btn = document.getElementById('queryBtn');
  btn.disabled = true;
  setMsg('查询中...', 'info');

  try {
    // 读取静态 data.json（同源，无 CORS 问题）
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('数据加载失败，请稍后重试');
    const records = await res.json();

    // 按姓名精确匹配（取最后一条，即最新提交）
    const matches = records.filter(r => r.name === name);
    if (matches.length === 0) {
      setMsg(`未找到「${name}」的测评记录，请确认姓名与填表时一致`, 'error');
      btn.disabled = false;
      return;
    }
    const rec = matches[matches.length - 1];

    const params = new URLSearchParams({
      name:      rec.name,
      team:      rec.team,
      base:      rec.base,
      level:     rec.level,
      title:     rec.title,
      total:     rec.total,
      max:       '45',
      breadth:   rec.breadth,
      control:   rec.control,
      form:      rec.form,
      influence: rec.influence,
      weak:      rec.weak,
      date:      rec.date,
    });

    setMsg('找到记录，正在跳转...', 'success');
    setTimeout(() => {
      window.location.href = 'report.html?' + params.toString();
    }, 500);

  } catch(e) {
    setMsg(e.message || '网络错误，请重试', 'error');
    btn.disabled = false;
  }
}

// 回车触发查询
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') query();
});

// 从表单提交跳转过来时，更新提示文案并自动聚焦
const fromSubmit = new URLSearchParams(window.location.search).get('from') === 'submit';
if (fromSubmit) {
  document.getElementById('pageTitle').textContent = '测评已提交 🎉';
  document.getElementById('pageSub').innerHTML = '输入刚才填写的姓名<br>立即查看您的 AI 能力报告';
}
document.getElementById('nameInput').focus();
</script>
</body>
</html>
